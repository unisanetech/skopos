name: Publish the certified CLI candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact protected release tag to certify or publish (for example v0.1.0)
        required: true
        type: string
      mode:
        description: Certification never publishes; bootstrap is only for the first package; OIDC is the normal path
        required: true
        default: certify
        type: choice
        options:
          - certify
          - bootstrap-publish
          - oidc-publish

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  certify:
    name: Certify the exact tagged candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      candidate_sha: ${{ steps.identity.outputs.candidate_sha }}
      package_version: ${{ steps.identity.outputs.package_version }}
    steps:
      - name: Check out the requested tag without retained credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8

      - name: Install the certification runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin the npm client used for publication
        run: npm install --global npm@11.15.0

      - name: Verify the requested tag and package identity
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          node -e "const p=require('./packages/cli/package.json'); const tag=process.env.RELEASE_TAG.slice(1); if(p.name!=='@skopos/cli'||p.version!==tag||p.publishConfig?.access!=='public'||p.publishConfig?.tag!=='next'||p.repository?.url!=='git+https://github.com/unisanetech/skopos.git') process.exit(1)"
          test "$(npm --version)" = "11.15.0"
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "package_version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Install the frozen workspace without a release cache
        run: pnpm install --frozen-lockfile

      - name: Prove security and publishing controls
        run: |
          pnpm release:security:validate
          pnpm release:publish:validate
          pnpm release:scorecard:validate

      - name: Reconstruct project Memory and capabilities from tracked truth
        run: pnpm release:reconstruct:validate

      - name: Prove the complete source candidate
        run: |
          pnpm typecheck
          pnpm test
          pnpm proof
          pnpm release:smoke

      - name: Pack and identify the one reviewed artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release/packed
          pnpm --filter @skopos/cli pack --pack-destination "$GITHUB_WORKSPACE/.release/packed" --json > .release/pack.json
          test "$(find .release/packed -maxdepth 1 -name "skopos-cli-${PACKAGE_VERSION}.tgz" -type f | wc -l | tr -d ' ')" = "1"
          (cd .release && sha256sum "packed/skopos-cli-${PACKAGE_VERSION}.tgz" > skopos-cli.sha256)
          npm publish ".release/packed/skopos-cli-${PACKAGE_VERSION}.tgz" --tag next --access public --dry-run

      - name: Preserve the reviewed candidate artifact and manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skopos-cli-publish-candidate-${{ steps.identity.outputs.candidate_sha }}
          path: |
            .release/pack.json
            .release/skopos-cli.sha256
            .release/packed/skopos-cli-${{ steps.identity.outputs.package_version }}.tgz
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish the certified artifact after protected approval
    needs: certify
    if: github.ref == 'refs/heads/main' && inputs.mode != 'certify'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm-release
      url: https://www.npmjs.com/package/@skopos/cli
    env:
      PACKAGE_VERSION: ${{ needs.certify.outputs.package_version }}
    steps:
      - name: Install the trusted-publishing runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin the npm client used for publication
        run: npm install --global npm@11.15.0

      - name: Download the exact certified artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skopos-cli-publish-candidate-${{ needs.certify.outputs.candidate_sha }}
          path: .release

      - name: Verify the transferred package identity
        shell: bash
        run: |
          set -euo pipefail
          cd .release
          sha256sum --check --strict skopos-cli.sha256
          test "$(find packed -maxdepth 1 -name "skopos-cli-${PACKAGE_VERSION}.tgz" -type f | wc -l | tr -d ' ')" = "1"
          tar -xOf "packed/skopos-cli-${PACKAGE_VERSION}.tgz" package/package.json > package.json
          node -e "const p=require('./package.json'); if(p.name!=='@skopos/cli'||p.version!==process.env.PACKAGE_VERSION||p.publishConfig?.tag!=='next'||p.publishConfig?.access!=='public') process.exit(1)"

      - name: Bootstrap the first package with a temporary token
        if: inputs.mode == 'bootstrap-publish'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          npm publish ".release/packed/skopos-cli-${PACKAGE_VERSION}.tgz" --tag next --access public --provenance

      - name: Publish an existing package through npm trusted publishing
        if: inputs.mode == 'oidc-publish'
        shell: bash
        run: |
          set -euo pipefail
          test -z "${NODE_AUTH_TOKEN:-}"
          npm publish ".release/packed/skopos-cli-${PACKAGE_VERSION}.tgz" --tag next --access public

      - name: Verify published registry identity
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            version="$(npm view @skopos/cli@next version --json 2>/dev/null | tr -d '\"')"
            if [[ "$version" == "$PACKAGE_VERSION" ]]; then
              npm view "@skopos/cli@${PACKAGE_VERSION}" name version dist.integrity dist.tarball --json
              exit 0
            fi
            sleep 10
          done
          exit 1
