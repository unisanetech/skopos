name: Release security and runtime proof

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-matrix:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22.13.0'
          - os: ubuntu-24.04
            node: '24'
          - os: macos-15
            node: '22.13.0'
          - os: macos-15
            node: '24'
          - os: windows-2025
            node: '22.13.0'
          - os: windows-2025
            node: '24'
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false

      - name: Install the locked workspace
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Verify the public package boundary
        run: pnpm release:check

      - name: Exercise canonical lifecycle and snapshot portability
        run: pnpm proof

  security-artifacts:
    name: Secrets, licenses, audit, and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8

      - name: Install Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false

      - name: Install the locked workspace
        run: pnpm install --frozen-lockfile

      - name: Fail on critical or high production advisories
        run: pnpm audit --prod --audit-level high

      - name: Build and pack the exact CLI candidate
        shell: bash
        run: |
          pnpm build
          mkdir -p .release/packed .release/package .release/install
          pnpm --filter @unisane/skopos pack --pack-destination "$GITHUB_WORKSPACE/.release/packed"
          tar -xzf .release/packed/unisane-skopos-0.1.0.tgz -C .release/package
          node -e "require('node:fs').writeFileSync('.release/install/package.json', '{\"name\":\"@skopos/release-proof\",\"version\":\"0.0.0\",\"private\":true,\"license\":\"Apache-2.0\",\"type\":\"module\"}\n')"
          npm install --prefix .release/install "$GITHUB_WORKSPACE/.release/packed/unisane-skopos-0.1.0.tgz" --omit=dev --ignore-scripts

      - name: Install checksum-pinned known-good Gitleaks
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Prove the secret scanner detects a positive canary
        shell: bash
        run: |
          set -euo pipefail
          canary_root="$RUNNER_TEMP/gitleaks-positive-canary"
          mkdir -p "$canary_root/input"
          printf 'token = "%s%s"\n' 'ghp_' 'aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789' > "$canary_root/input/fixture.txt"
          set +e
          gitleaks detect --no-git --no-banner --redact \
            --report-format json --report-path "$canary_root/report.json" \
            --source "$canary_root/input" >/dev/null 2>&1
          canary_exit=$?
          set -e
          test "$canary_exit" -eq 1
          node -e "const x=require(process.argv[1]);if(!Array.isArray(x)||x.length!==1||x[0].RuleID!=='github-pat')process.exit(1)" "$canary_root/report.json"
          rm -rf "$canary_root"

      - name: Scan complete Git history for secrets
        shell: bash
        run: gitleaks detect --redact --no-banner --source .

      - name: Scan the installed packed CLI for secrets
        shell: bash
        run: |
          test -n "$(find .release/package/package -type f -print -quit)"
          gitleaks detect --no-git --redact --no-banner --source .release/package/package

      - name: Generate and enforce the installed dependency license report
        shell: bash
        run: node scripts/release/scan-installed-licenses.mjs .release/install .release/licenses.json

      - name: Generate the installed candidate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .release/install
          format: cyclonedx-json
          output-file: .release/unisane-skopos.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SBOM structure
        shell: bash
        run: node -e "const x=require('./.release/unisane-skopos.cdx.json'); if(x.bomFormat!=='CycloneDX'||!Array.isArray(x.components)||x.components.length===0) process.exit(1)"

      - name: Upload non-secret release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unisane-skopos-release-security-${{ github.sha }}
          path: |
            .release/licenses.json
            .release/unisane-skopos.cdx.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
