<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Incident operations</title><link rel="stylesheet" href="./styles.css"></head><body>
<header><strong>Northstar Ops</strong><nav aria-label="Global"><a href="#queue">Queue</a><a href="#services">Services</a><a href="#reports">Reports</a></nav><button>New incident</button></header>
<main><aside><h1>Incidents</h1><label>Search<input id="search" placeholder="Service or incident"></label><fieldset><legend>Severity</legend><label><input type="checkbox" value="critical">Critical</label><label><input type="checkbox" value="high">High</label></fieldset></aside>
<section id="queue"><div class="toolbar"><p>12 open · Updated just now</p><select aria-label="Sort incidents"><option>Most urgent</option><option>Newest</option></select></div><div class="table" role="list"><button class="row selected" data-detail="Payments API|Critical|Maya Chen|2 min ago"><b>Payments API unavailable</b><span>Critical</span><small>Maya Chen · 2 min</small></button><button class="row" data-detail="Search indexing|High|Unassigned|11 min ago"><b>Search indexing delayed</b><span>High</span><small>Unassigned · 11 min</small></button><button class="row" data-detail="Email delivery|High|Ravi Singh|24 min ago"><b>Email delivery degraded</b><span>High</span><small>Ravi Singh · 24 min</small></button></div></section>
<aside class="detail"><p>Selected incident</p><h2 id="detail-title">Payments API</h2><dl><dt>Severity</dt><dd id="severity">Critical</dd><dt>Owner</dt><dd id="owner">Maya Chen</dd><dt>Last update</dt><dd id="updated">2 min ago</dd></dl><button id="ack">Acknowledge incident</button><p id="status" role="status"></p></aside></main><script type="module" src="./src.js"></script></body></html>
