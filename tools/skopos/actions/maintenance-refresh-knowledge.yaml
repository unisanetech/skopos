id: maintenance.refresh-knowledge
title: Refresh self-hosted knowledge state
description: Rebuild the local Skopos compiled knowledge artifacts for the Skopos subtree after config, docs routing, package topology, or Action changes.
category: maintenance
scope:
  - workspace
command: pnpm exec node --import tsx packages/cli/src/cli.ts init . --json
cwd: .
inputs:
  - package.json
  - pnpm-workspace.yaml
  - skopos.config.yaml
  - AGENTS.md
  - packages
  - docs/00-start-here.md
  - docs/architecture
  - docs/decisions
  - docs/domains
  - docs/findings
  - docs/guides
  - docs/operations
  - docs/patterns
  - docs/standards
  - tools/skopos
outputs:
  - .skopos/index
outputExcludes:
  - .skopos/index/memory.json
  - .skopos/index/readiness.json
  - .skopos/index/work-queue.json
  - .skopos/index/understanding
affects:
  - .skopos/index
capabilities:
  process: required
  network: none
  browser: none
  tools: [pnpm]
  secrets: []
  services: []
effects:
  workspace: declared
  artifacts: none
  external: none
concurrency: exclusive
workspaceMode: overlay-safe
safety: mutating
requiresApproval: false
whenToUse: Run after changing the Skopos subtree workspace shape, root config, docs routing, or declared Actions.
phases:
  - stabilization
risks:
  - standard
  - high-impact
recommendedAfter:
  - plan
  - impact
owner: skopos-core
