id: graph.render-local-portal
title: Render local Skopos portal
description: Render the local HTML portal and graph portal from the current Skopos compiled artifacts for human inspection while dogfooding the subtree.
category: graph-generator
scope:
  - workspace
  - docs
command: pnpm skopos:ui
cwd: .
inputs:
  - .skopos
  - docs
  - packages/ui
  - packages/cli
outputs:
  - .skopos/ui/index.html
  - .skopos/ui/graph-portal.html
affects:
  - .skopos/ui
capabilities:
  process: required
  network: none
  browser: none
  tools: [pnpm]
  secrets: []
  services: []
effects:
  workspace: declared
  artifacts: none
  external: none
concurrency: exclusive
safety: mutating
requiresApproval: false
whenToUse: Run after changing graph artifacts, portal rendering, Readiness projections, or recent activity views.
phases:
  - stabilization
risks:
  - standard
  - high-impact
recommendedAfter:
  - maintenance.refresh-knowledge
owner: skopos-core
