id: instructions.sync-mirrors
title: Sync self-hosted instruction mirrors
description: Regenerate CLAUDE, Cursor, and Copilot instruction mirrors from the Skopos subtree AGENTS.md source.
category: docs-generator
scope:
  - workspace
command: pnpm instructions:sync
cwd: .
inputs:
  - AGENTS.md
  - package.json
  - packages/cli/src/cli/commands/instructions.ts
  - packages/instructions/src
outputs:
  - AGENTS.md
  - CLAUDE.md
  - .cursor/rules/project.mdc
  - .github/copilot-instructions.md
affects:
  - AGENTS.md
  - CLAUDE.md
  - .cursor/rules/project.mdc
  - .github/copilot-instructions.md
capabilities:
  process: required
  network: none
  browser: none
  tools: [pnpm]
  secrets: []
  services: []
effects:
  workspace: declared
  artifacts: none
  external: none
concurrency: exclusive
workspaceMode: overlay-safe
safety: mutating
requiresApproval: false
whenToUse: Run after changing AGENTS.md or instruction-routing guidance inside the Skopos subtree.
phases:
  - stabilization
  - closure
risks:
  - standard
  - high-impact
recommendedAfter:
  - plan
  - impact
owner: skopos-core
