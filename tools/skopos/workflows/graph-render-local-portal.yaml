id: graph.render-local-portal
title: Render local Skopos portal
description: Render the local HTML portal and graph portal from the current Skopos compiled artifacts for human inspection while dogfooding the subtree.
category: graph-generator
scope:
  - workspace
  - docs
command: pnpm skopos:ui
cwd: .
inputs:
  - .skopos
  - docs
  - packages/ui
  - packages/cli
outputs:
  - docs/generated/skopos/index.html
  - docs/generated/skopos/graph-portal.html
affects:
  - docs/generated/skopos
safety: mutating
requiresApproval: false
whenToUse: Run after changing graph artifacts, portal rendering, trust projections, or recent activity views.
requiredForDone: false
recommendedAfter:
  - maintenance.refresh-knowledge
owner: skopos-core
