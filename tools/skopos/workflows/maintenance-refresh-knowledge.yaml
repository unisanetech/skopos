id: maintenance.refresh-knowledge
title: Refresh self-hosted knowledge state
description: Rebuild the local Skopos compiled knowledge artifacts for the Skopos subtree after config, docs routing, package topology, or workflow changes.
category: maintenance
scope:
  - workspace
command: pnpm skopos:init
cwd: .
inputs:
  - package.json
  - pnpm-workspace.yaml
  - skopos.config.yaml
  - AGENTS.md
  - packages
  - docs
  - tools/skopos/workflows
outputs:
  - .skopos/bootstrap.json
  - .skopos/scopes-lite.json
  - .skopos/diagnosis.json
  - .skopos/architecture.json
  - .skopos/enforcement.json
  - .skopos/index.json
  - .skopos/log.jsonl
affects:
  - .skopos
safety: mutating
requiresApproval: false
whenToUse: Run after changing the Skopos subtree workspace shape, root config, docs routing, or registered workflows.
requiredForDone: false
recommendedAfter:
  - plan
  - impact
owner: skopos-core
