schemaVersion: 1
project:
  name: skopos
  archetype: library
  repoMode: monorepo
  scopeStrategy: package
  mode: clean-refactor
commands:
  dev: pnpm dev
  build: pnpm build
  test: pnpm test
  typecheck: pnpm typecheck
workspace:
  ignore:
    - policy-packs
    - stack-packs
    - gate-packs
    - workflow-packs
    - fixtures
    - internal
    - tests
    - .skopos
docs:
  root: docs
  startHerePath: docs/00-start-here.md
  usePerDomainArchive: true
  strictMetadata: true
  strictLinking: true
agents:
  canonicalInstructions: AGENTS.md
  syncMirrors:
    - CLAUDE.md
    - .cursor/rules/project.mdc
    - .github/copilot-instructions.md
  mcp: true
verification:
  mode: balanced
  requireDocsSync: true
  requireEvidenceForReadiness: true
decisions:
  mode: balanced
  askFor:
    - architecture-shift
    - public-api-change
    - destructive-migration
    - vendor-choice
    - security-privacy-change
security:
  privacyMode: local-only
  redactSecrets: true
storage:
  softLimitMb: 512
  hardLimitMb: 1024
  retentionDays:
    temporary: 1
    cache: 14
    diagnostic: 30
    taskEvidence: 90
    releaseEvidence: 365
