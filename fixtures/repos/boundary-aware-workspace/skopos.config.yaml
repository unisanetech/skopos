schemaVersion: 1
project:
  name: boundary-aware-workspace
  archetype: monorepo-platform
  repoMode: monorepo
  scopeStrategy: hybrid
commands:
  dev: pnpm dev
  build: pnpm build
  test: pnpm test
  typecheck: pnpm typecheck
workspace:
  ignore:
    - fixtures
    - internal
    - tests
docs:
  root: docs
  usePerDomainArchive: true
  strictMetadata: true
  strictLinking: true
agents:
  canonicalInstructions: AGENTS.md
  syncMirrors:
    - CLAUDE.md
    - .cursor/rules/project.mdc
    - .github/copilot-instructions.md
  mcp: true
verification:
  mode: balanced
  requireDocsSync: true
  requireEvidenceForReadiness: true
decisions:
  mode: balanced
  askFor:
    - architecture-shift
    - public-api-change
    - destructive-migration
    - vendor-choice
    - security-privacy-change
security:
  privacyMode: local-only
  redactSecrets: true
