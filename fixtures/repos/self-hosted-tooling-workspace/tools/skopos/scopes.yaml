schemaVersion: 1
scopes:
  - id: workspace
    title: Self-Hosted Tooling Workspace
    kind: workspace
    path: .
    memoryRoot: docs
    codeRoots:
      - .
    parent: null
    profile: core.workspace
    dependsOn: []
    owners:
      - skopos-core
    aliases:
      - "@selfhost/workspace"

  - id: selfhost-cli
    title: Self-Hosted CLI
    kind: tool
    path: packages/cli
    memoryRoot: docs/scopes/selfhost-cli
    codeRoots:
      - packages/cli
    parent: workspace
    profile: core.tool
    dependsOn:
      - selfhost-core
    owners:
      - skopos-core
    aliases:
      - "@selfhost/cli"

  - id: selfhost-core
    title: Self-Hosted Core
    kind: package
    path: packages/core
    memoryRoot: docs/scopes/selfhost-core
    codeRoots:
      - packages/core
    parent: workspace
    profile: core.public-library
    dependsOn: []
    owners:
      - skopos-core
    aliases:
      - "@selfhost/core"

  - id: selfhost-ui
    title: Self-Hosted UI
    kind: application
    path: packages/ui
    memoryRoot: docs/scopes/selfhost-ui
    codeRoots:
      - packages/ui
    parent: workspace
    profile: core.application
    dependsOn:
      - selfhost-core
    owners:
      - skopos-core
    aliases:
      - "@selfhost/ui"
